<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Garage: The Game</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEEEF;--surface:#fff;--ink:#14171A;--muted:#505A63;--line:#CBD1D6;--blue:#1D3FD6;--yellow:#F5C400;--on-blue:#fff;
--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--surface:#1A1E22;--ink:#EEF0F2;--muted:#9AA4AD;--line:#2E353B;--blue:#6F8BFF;--on-blue:#0B1230;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101316;--surface:#1A1E22;--ink:#EEF0F2;--muted:#9AA4AD;--line:#2E353B;--blue:#6F8BFF;--on-blue:#0B1230;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:500 1rem/1.45 var(--body)}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
h1,h2{font-family:var(--display);font-style:italic;font-weight:900;line-height:.95;margin:0}
h1{font-size:clamp(3.5rem,14vw,7rem);color:var(--blue)}
h2{font-size:1.9rem;margin:1.6rem 0 .7rem}
.muted{color:var(--muted)}small{display:block;color:var(--muted);font-weight:400}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#menu,#res{position:absolute;inset:0;overflow:auto;background:var(--bg)}
#res{background:rgba(10,12,16,.82);display:flex;align-items:center;justify-content:center;color:#fff}
#res .card{background:var(--surface);color:var(--ink);padding:1.6rem;border-radius:8px;border-top:10px solid var(--yellow);max-width:420px;width:92%}
#res h2{font-size:3.4rem;margin:0 0 .5rem}
.wrap{max-width:960px;margin:0 auto;padding:1.5rem 1.2rem 3rem}
.grid{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.opt,.panel{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:.8rem 1rem;color:var(--ink);text-align:left;font:inherit}
.opt{cursor:pointer;display:flex;flex-direction:column;gap:.1rem}.opt b{font-weight:600}.opt span{color:var(--muted);font-size:.92rem}
.opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.opt:disabled{opacity:.5;cursor:not-allowed}
.bar{display:grid;grid-template-columns:110px 1fr;gap:.6rem;align-items:center;margin:.45rem 0}
.bar i{display:block;height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar u{display:block;height:100%;background:var(--blue);text-decoration:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:.55rem 0}
.step{display:flex;align-items:center;gap:.5rem}.step em{font-style:normal;font-weight:600;min-width:1.2rem;text-align:center}
.step button,.sw button{cursor:pointer}
.step button{width:2.4rem;height:2.4rem;border-radius:6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:600 1.2rem var(--body)}
.sw{display:flex;gap:.5rem;margin-top:1rem}.sw button{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid var(--line)}.sw .on{border:3px solid var(--ink)}
.go{margin-top:1.6rem;background:var(--blue);color:var(--on-blue);border:0;border-radius:6px;padding:.6rem 2.2rem;cursor:pointer;font:italic 900 2.2rem var(--display)}
#hud{position:absolute;left:.8rem;top:.8rem;background:rgba(0,0,0,.6);color:#fff;padding:.5rem .9rem;border-radius:6px;font:italic 800 1.5rem/1.15 var(--display)}
#hud small{color:#ddd;font:500 .9rem var(--body)}
#spd{position:absolute;left:50%;bottom:6.2rem;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.55);padding:.15rem .8rem;border-radius:6px;font:italic 800 1.3rem var(--display)}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 900 min(30vw,11rem) var(--display);color:var(--yellow);text-shadow:0 4px 0 rgba(0,0,0,.5);pointer-events:none}
#quit{position:absolute;right:.8rem;top:7rem;border:0;border-radius:6px;padding:.35rem .8rem;background:rgba(0,0,0,.6);color:#fff;font:600 .9rem var(--body);cursor:pointer}
#pad{position:absolute;left:0;right:0;bottom:.8rem;display:none;justify-content:space-between;padding:0 .8rem;pointer-events:none}
#pad div{display:flex;gap:.6rem}
#pad button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;min-width:4.6rem;height:4.6rem;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.55);color:#fff;font:700 1.1rem var(--body)}
#pad button[data-k=G]{background:var(--blue);color:var(--on-blue)}
@media (pointer:coarse){#pad.on{display:flex}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="ui" hidden>
    <div id="hud"><span id="pos"></span><br><span id="lap"></span><small id="tm"></small></div>
    <div id="spd"></div><div id="cd"></div>
    <button id="quit">Garage</button>
  </div>
  <div id="pad"><div><button data-k="L">◀</button><button data-k="R">▶</button></div><div><button data-k="B">Brake</button><button data-k="G">Gas</button></div></div>
  <div id="menu"></div>
  <div id="res" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),x=cv.getContext('2d'),m=$('#menu'),res=$('#res'),ui=$('#ui');
const DIFF=[{n:'Easy',f:.85,s:'Rivals are slow and brake early'},{n:'Normal',f:1,s:'An even race'},{n:'Hard',f:1.1,s:'Rivals are quick in the corners'},{n:'Expert',f:1.2,s:'Near-perfect rivals'}];
const LAPS=3,COLORS=['#E5352B','#1D3FD6','#F5C400','#1FA463','#FF7A1A','#EDEDED'];
const TR=[
{n:'Neon Harbor',s:'Night docks, wet roads',bg:'#0B1020',road:'#2B3248',edge:'#37D7FF',gr:'rgba(255,255,255,.07)',g:.85,w:130,
 p:[[300,200],[700,150],[1100,220],[1400,400],[1300,650],[1000,700],[900,500],[650,520],[600,800],[900,1000],[400,1050],[200,800],[150,450]]},
{n:'Sunfire Canyon',s:'Desert mountain pass',bg:'#D9A864',road:'#5A4636',edge:'#B5532F',gr:'rgba(0,0,0,.08)',g:1,w:130,
 p:[[200,600],[450,300],[800,250],[1000,500],[1300,300],[1650,400],[1700,750],[1400,950],[1050,800],[800,1000],[450,1000],[250,850]]},
{n:'Ironridge Speedway',s:'High-speed banked circuit',bg:'#3C7A3A',road:'#3A3F46',edge:'#E8E8E8',gr:'rgba(0,0,0,.08)',g:1.1,w:150,
 p:[[400,250],[900,200],[1400,250],[1650,450],[1650,750],[1400,950],[900,1000],[400,950],[150,750],[150,450]]},
{n:'Frostline Rally',s:'Snowy forest, low grip',bg:'#D3DEE8',road:'#7C8996',edge:'#E04B3A',gr:'rgba(0,0,0,.07)',g:.5,w:130,
 p:[[300,300],[700,200],[1000,400],[1300,250],[1650,450],[1500,750],[1150,650],[1000,900],[650,1000],[300,850],[400,600]]}];
const CARS=[
{n:'Pocket Rocket',c:'Hot hatch',a:360,t:300,g:6,u:2.8},
{n:'Brute V8',c:'Muscle',a:470,t:340,g:3.6,u:2.4},
{n:'Kiro RS',c:'Japanese tuner',a:420,t:345,g:5.2,u:2.7},
{n:'Strada GT',c:'European sports',a:400,t:360,g:6.6,u:2.9},
{n:'Vanta One',c:'Hypercar',a:560,t:420,g:5.6,u:2.5,lock:1}];
let save={unlock:0,best:{}};try{Object.assign(save,JSON.parse(localStorage.getItem('apex')||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem('apex',JSON.stringify(save))}catch(e){}};
let sel={t:0,c:2,k:1,d:1,u:{e:0,t:0,w:0}},trk,cars=[],pl,state='menu',t0=0,clock=0,order=[],marks=[],keys={},W=0,H=0,dpr=1,last=0,bestLap=0;
const fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0');
const stats=(c,u)=>({a:c.a*(1+.1*u.e+.03*u.w),t:c.t*(1+.04*u.e-.015*u.t),g:c.g*(1+.12*u.t-.04*u.w),u:c.u*(1+.05*u.w-.03*u.e)});

function rs(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',rs);

function build(t){
 const P=t.p.map(([a,b])=>[a*1.5,b*1.5]),n=P.length,pts=[];
 for(let i=0;i<n;i++){const a=P[(i+n-1)%n],b=P[i],c=P[(i+1)%n],d=P[(i+2)%n];
  for(let k=0;k<16;k++){const s=k/16,s2=s*s,s3=s2*s;
   pts.push([0,1].map(j=>.5*(2*b[j]+(-a[j]+c[j])*s+(2*a[j]-5*b[j]+4*c[j]-d[j])*s2+(-a[j]+3*b[j]-3*c[j]+d[j])*s3)))}}
 const path=new Path2D();pts.forEach(([a,b],i)=>i?path.lineTo(a,b):path.moveTo(a,b));path.closePath();
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),bx=Math.min(...xs),by=Math.min(...ys);
 return{...t,pts,path,bx,by,bw:Math.max(...xs)-bx,bh:Math.max(...ys)-by}}
const ang=i=>{const N=trk.pts.length,a=trk.pts[i],b=trk.pts[(i+1)%N];return Math.atan2(b[1]-a[1],b[0]-a[0])};

function step(c,inp,dt){
 const s=c.s,fx=Math.cos(c.a),fy=Math.sin(c.a),off=c.d>trk.w/2;
 let vf=c.vx*fx+c.vy*fy,vl=-c.vx*fy+c.vy*fx;
 if(inp.gas)vf+=s.a*(off?.6:1)*dt;
 if(inp.brk){if(vf>5)vf-=700*dt;else vf=Math.max(vf-s.a*.5*dt,-90)}
 vf*=1-(off?1.4:.45)*dt;
 if(vf>s.t)vf-=(vf-s.t)*4*dt;
 vl*=Math.exp(-s.g*trk.g*(off?.7:1)*dt);
 c.vx=fx*vf-fy*vl;c.vy=fy*vf+fx*vl;
 c.a+=inp.st*s.u*dt*Math.max(-1,Math.min(1,vf/140))/(1+Math.abs(vf)/1000);
 c.x+=c.vx*dt;c.y+=c.vy*dt;c.sp=Math.hypot(c.vx,c.vy);c.sl=Math.abs(vl)}

function ai(c){
 const N=trk.pts.length,tp=trk.pts[(c.i+8+(c.sp/22|0))%N];
 let d=Math.atan2(tp[1]-c.y,tp[0]-c.x)-c.a;d=Math.atan2(Math.sin(d),Math.cos(d));
 const brk=Math.abs(d)>.7&&c.sp>230;
 return{st:Math.max(-1,Math.min(1,d*2.2)),gas:!brk,brk}}

function locate(c){
 const N=trk.pts.length;let best=1e12,bi=c.i;
 for(let o=-25;o<=25;o++){const j=(c.i+o+N)%N,p=trk.pts[j],d=(p[0]-c.x)**2+(p[1]-c.y)**2;if(d<best){best=d;bi=j}}
 let dd=bi-c.i;if(dd>N/2)dd-=N;if(dd<-N/2)dd+=N;
 c.prog+=dd;c.i=bi;c.d=Math.sqrt(best)}

function sim(dt){
 const N=trk.pts.length;
 for(const c of cars){
  const inp=c.ai||c.fin?ai(c):{st:(keys.R?1:0)-(keys.L?1:0),gas:!!keys.G,brk:!!keys.B};
  step(c,inp,dt);locate(c);
  const lap=Math.max(1,Math.floor(c.prog/N)+1);
  if(lap>c.lap&&lap<=LAPS){const lt=clock-c.lapStart;c.lapStart=clock;c.lap=lap;if(c===pl&&(!bestLap||lt<bestLap))bestLap=lt}
  if(!c.fin&&c.prog>=LAPS*N){c.fin=clock;order.push(c);if(c===pl){const lt=clock-c.lapStart;if(!bestLap||lt<bestLap)bestLap=lt;finish()}}}
 for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
  const a=cars[i],b=cars[j];let dx=a.x-b.x,dy=a.y-b.y;const d=Math.hypot(dx,dy);
  if(d<32&&d>0){dx/=d;dy/=d;const o=(32-d)/2;a.x+=dx*o;a.y+=dy*o;b.x-=dx*o;b.y-=dy*o;
   const dv=(a.vx-b.vx)*dx+(a.vy-b.vy)*dy;
   if(dv<0){a.vx-=dx*dv*.6;a.vy-=dy*dv*.6;b.vx+=dx*dv*.6;b.vy+=dy*dv*.6}}}
 if(pl.sl>70&&pl.d<trk.w/2){marks.push([pl.x,pl.y]);if(marks.length>400)marks.shift()}}

function finish(){
 state='done';const p=order.indexOf(pl)+1,old=save.best[sel.t];let note='';
 if(bestLap&&(!old||bestLap<old)){save.best[sel.t]=bestLap;note='New best lap on this track.'}
 if(p==1&&!save.unlock){save.unlock=1;note='You unlocked the Vanta One hypercar.'}
 store();
 setTimeout(()=>{if(state!='done')return;res.innerHTML=`<div class="card"><h2>${['','1st','2nd','3rd','4th'][p]} place</h2>
 <p>Race time <b>${fmt(pl.fin)}</b><br>Best lap <b>${fmt(bestLap)}</b></p>${note?`<p><b>${note}</b></p>`:''}
 <button class="go" data-a="go:0" style="margin:.4rem .5rem 0 0;font-size:1.7rem">Race again</button>
 <button class="go" data-a="garage:0" style="margin-top:.4rem;font-size:1.7rem;background:var(--ink);color:var(--bg)">Garage</button></div>`;res.hidden=false},1200)}

function start(){
 trk=build(TR[sel.t]);const N=trk.pts.length,car=CARS[sel.c];
 const defs=[{col:'#9AA4AD',f:1.02},{col:'#FF7A1A',f:.98},{col:'#7C4DFF',f:.94},{col:COLORS[sel.k],s:stats(car,sel.u)}];
 cars=defs.map((d,k)=>{const i=(N-5*(k+1))%N,a=ang(i),p=trk.pts[i],o=(k%2?1:-1)*28;
  return{col:d.col,s:d.s||{a:400*d.f*DIFF[sel.d].f,t:335*d.f*DIFF[sel.d].f,g:5,u:2.7*(.9+.1*DIFF[sel.d].f)},x:p[0]-Math.sin(a)*o,y:p[1]+Math.cos(a)*o,a,vx:0,vy:0,sp:0,sl:0,i,prog:-5*(k+1),lap:1,d:0,lapStart:0,fin:0,ai:k<3}});
 pl=cars[3];order=[];marks=[];bestLap=0;clock=-3;state='count';t0=performance.now();
 m.hidden=true;res.hidden=true;ui.hidden=false;$('#pad').classList.add('on')}
function toMenu(){state='menu';m.hidden=false;res.hidden=true;ui.hidden=true;$('#pad').classList.remove('on');menu()}

function draw(){
 const T=trk,z=Math.max(.5,Math.min(1,Math.min(W,H)/600)),cx=pl.x+pl.vx*.2,cy=pl.y+pl.vy*.2,hw=W/z/2,hh=H/z/2;
 x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle=T.bg;x.fillRect(0,0,W,H);
 x.save();x.translate(W/2,H/2);x.scale(z,z);x.translate(-cx,-cy);
 x.strokeStyle=T.gr;x.lineWidth=2;x.beginPath();
 const x0=Math.floor((cx-hw)/200)*200,y0=Math.floor((cy-hh)/200)*200;
 for(let a=x0;a<cx+hw+200;a+=200){x.moveTo(a,y0);x.lineTo(a,cy+hh+200)}
 for(let b=y0;b<cy+hh+200;b+=200){x.moveTo(x0,b);x.lineTo(cx+hw+200,b)}
 x.stroke();x.lineJoin='round';
 x.strokeStyle=T.edge;x.lineWidth=T.w+18;x.stroke(T.path);
 x.strokeStyle=T.road;x.lineWidth=T.w;x.stroke(T.path);
 x.setLineDash([26,26]);x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=3;x.stroke(T.path);x.setLineDash([]);
 x.save();x.translate(T.pts[0][0],T.pts[0][1]);x.rotate(ang(0));
 for(let k=0;k*12<T.w;k++)for(let q=0;q<2;q++){x.fillStyle=(k+q)%2?'#111':'#fff';x.fillRect(-12+q*12,-T.w/2+k*12,12,12)}
 x.restore();
 x.fillStyle='rgba(0,0,0,.35)';for(const [a,b] of marks)x.fillRect(a-2,b-2,4,4);
 for(const c of cars){x.save();x.translate(c.x,c.y);x.rotate(c.a);
  x.fillStyle='rgba(0,0,0,.3)';x.fillRect(-19,-8,42,24);
  x.fillStyle=c.col;x.fillRect(-20,-10,40,20);
  x.fillStyle='rgba(0,0,0,.4)';x.fillRect(-7,-8,15,16);
  x.fillStyle='#FFF2A8';x.fillRect(17,-8,3,4);x.fillRect(17,4,3,4);
  if(c===pl){x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(-20,-10,40,20)}
  x.restore()}
 x.restore();
 const mw=120,mh=90,s=Math.min((mw-12)/T.bw,(mh-12)/T.bh);
 x.save();x.translate(W-mw-10,10);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,mw,mh);
 x.translate(6-T.bx*s,6-T.by*s);x.scale(s,s);x.lineWidth=7/s;x.strokeStyle='rgba(255,255,255,.75)';x.stroke(T.path);
 cars.forEach(c=>{x.fillStyle=c.col;x.beginPath();x.arc(c.x,c.y,(c===pl?7:5)/s,0,7);x.fill()});
 x.restore()}

function hud(){
 const r=[...cars].sort((a,b)=>(b.fin?1e9-b.fin:b.prog)-(a.fin?1e9-a.fin:a.prog));
 $('#pos').textContent='P'+(r.indexOf(pl)+1)+' of 4';
 $('#lap').textContent='Lap '+Math.min(pl.lap,LAPS)+' of '+LAPS;
 $('#tm').textContent=fmt(Math.max(0,clock));
 $('#spd').textContent=Math.round(pl.sp*.6)+' km/h';
 $('#cd').textContent=state=='count'?Math.ceil(-clock):clock<.8?'Go':''}

function frame(now){
 const dt=Math.min(.033,(now-last)/1000||0);last=now;
 if(state!='menu'){
  clock=(now-t0)/1000-3;
  if(state=='count'&&clock>=0)state='race';
  if(state!='count')sim(dt);
  draw();hud()}
 requestAnimationFrame(frame)}

function menu(){
 const car=CARS[sel.c],s=stats(car,sel.u),left=5-sel.u.e-sel.u.t-sel.u.w,
 bar=(l,v,mx)=>`<div class="bar"><span>${l}</span><i><u style="width:${Math.min(100,v/mx*100)}%"></u></i></div>`;
 m.innerHTML=`<div class="wrap"><h1>Apex Garage</h1>
<p class="muted">Pick a track and a car, spend your upgrade points, then race three rivals over ${LAPS} laps.</p>
<h2>Track</h2><div class="grid">${TR.map((t,i)=>`<button class="opt${i==sel.t?' on':''}" data-a="t:${i}"><b>${t.n}</b><span>${t.s}</span><span>${save.best[i]?'Best lap '+fmt(save.best[i]):'No lap yet'}</span></button>`).join('')}</div>
<h2>Car</h2><div class="grid">${CARS.map((c,i)=>{const lk=c.lock&&!save.unlock;return`<button class="opt${i==sel.c?' on':''}" data-a="c:${i}"${lk?' disabled':''}><b>${c.n}</b><span>${c.c}</span>${lk?'<span>Win a race to unlock</span>':''}</button>`}).join('')}</div>
<h2>Rival difficulty</h2><div class="grid">${DIFF.map((d,i)=>`<button class="opt${i==sel.d?' on':''}" data-a="d:${i}"><b>${d.n}</b><span>${d.s}</span></button>`).join('')}</div>
<h2>Garage</h2><div class="grid two"><div class="panel">${bar('Acceleration',s.a,700)}${bar('Top speed',s.t,500)}${bar('Grip',s.g,9)}${bar('Handling',s.u,3.6)}</div>
<div class="panel"><p style="margin:0"><b>${left}</b> upgrade points left. Every part has a cost.</p>
${[['e','Engine','More power, heavier steering'],['t','Tires','More grip, a little drag'],['w','Weight reduction','Sharper turns, less grip']].map(([k,n,d])=>`<div class="row"><span><b>${n}</b><small>${d}</small></span><span class="step"><button data-a="u:${k}-" aria-label="Lower ${n}">−</button><em>${sel.u[k]}</em><button data-a="u:${k}+" aria-label="Raise ${n}">+</button></span></div>`).join('')}
<div class="sw">${COLORS.map((c,i)=>`<button class="${i==sel.k?'on':''}" data-a="k:${i}" style="background:${c}" aria-label="Paint ${i+1}"></button>`).join('')}</div></div></div>
<button class="go" data-a="go:0">Start race</button>
<p class="muted">Drive with the arrow keys or WASD. On a phone, use the on-screen buttons.</p></div>`}

function click(e){
 const b=e.target.closest('[data-a]');if(!b)return;const [a,v]=b.dataset.a.split(':');
 if(a=='go'){start();return}if(a=='garage'){toMenu();return}
 if(a=='t')sel.t=+v;
 else if(a=='c'){if(!CARS[v].lock||save.unlock)sel.c=+v}
 else if(a=='k')sel.k=+v;
 else if(a=='d')sel.d=+v;
 else if(a=='u'){const k=v[0],d=v[1]=='+'?1:-1,u=sel.u,left=5-u.e-u.t-u.w;if(d>0&&left>0&&u[k]<3||d<0&&u[k]>0)u[k]+=d}
 menu()}

addEventListener('keydown',e=>{const k=KM[e.code];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k;b.onpointerdown=e=>{keys[k]=1;e.preventDefault()};
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
